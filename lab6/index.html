<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To Do List</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <h1>To Do List</h1>

      <nav>
        <button class="sidebar-button active" data-section="today">
          ☀️ Today
        </button>

        <button class="sidebar-button" data-section="upcoming">
          📅 Upcoming
        </button>

        <button class="sidebar-button" data-section="completed">
          ✅ Completed
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <p class="welcome-message">Let’s get things done! ✨</p>

      <h2 id="main-header">Today</h2>
      <p id="task-counter">0 tasks left for today.</p>

      <section class="add-task-section">
        <h3>Add a Task</h3>

        <form id="task-form">
          <input
            type="text"
            id="task-input"
            placeholder="What do you need to do?"
            required
          >

          <select id="category-input">
            <option value="School">School</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Shopping">Shopping</option>
          </select>

          <input type="date" id="date-input">

          <button type="submit" class="add-button">Add Task</button>
        </form>
      </section>

      <section class="task-section">
        <ul id="task-list"></ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
