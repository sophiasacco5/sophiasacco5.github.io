<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A checklist for keeping track of items in my bag."
    />
    <title>My Gameday Bag Checklist</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1>My Gameday Bag Checklist</h1>
    </header>

    <main>
      <section aria-labelledby="add-item-heading">
        <h2 id="add-item-heading">Add an Item to My Bag</h2>

        <form id="add-item-form">
          <label for="item-input">Item</label>
          <input
            type="text"
            id="item-input"
            name="item"
            placeholder="Enter an item"
            required
          />

          <button type="submit">Add to Bag</button>
        </form>
      </section>

      <section aria-labelledby="bag-items-heading">
        <h2 id="bag-items-heading">Items in My Bag</h2>

        <ul id="bag-items"></ul>

        <button type="button" id="remove-button">
          Remove Checked Items
        </button>
      </section>
    </main>
  </body>
</html>
