<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Code Clicker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game-container">
            <header>
                <h1>Code Clicker</h1>
                <h2 id="score-display">0 lines of code</h2>
                <button id="main-button" onclick="writeCode()">Write Code</button>
            </header>

          <main id="shop">
             <h3>Hardware Store (Manual Upgrade)</h3>
            <p>Current Click Power: <span id="power-display">1</span></p>
            <button id="upgrade-button" onclick="buyKeyboard()">
            Buy Mechanical Keyboard (Cost: ) <span id="cost-display">50</span>
            </button>

            <h3>Lunch Department (Manual Upgrade)</h3>
            <p>Lunch Click Power: <span id="lunch-power-display">1</span></p>
            <button id="lunch-button" onclick="buyLunch()">
             Buy Lunch (Cost: ) <span id="cost-lunch-display">25</span>
            </button>

            <h3>Hiring Department (Auto Clicking)</h3>
            <p>Active Interns: <span id="intern-display">0</span></p>
            <button id="intern-button" onclick="buyIntern()">
                Hire Intern (Cost: ) <span id="cost-intern-display">100</span>
            </button>

            <h3>Hiring Bosses (Auto Clicking)</h3>
            <p>Active Bosses: <span id="boss-display">0</span></p>
            <button id="boss-button" onclick="buyBoss()">
                Hire Boss (Cost: ) <span id="cost-boss-display">150</span>
            </button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
